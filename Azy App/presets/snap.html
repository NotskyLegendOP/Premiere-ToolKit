<!doctype html>
<html lang="en" data-section="snap">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;" />
  <title>Snap Action</title>
  <link rel="stylesheet" href="../design-tokens.css" />
  <link rel="stylesheet" href="../styles.css" />
  <link rel="stylesheet" href="presets.css" />
  <link rel="stylesheet" href="themes.css" />
  <link rel="stylesheet" href="snap.css" />
  <link rel="stylesheet" href="minimal.css" />
  <link rel="stylesheet" href="palette.css" />
  <link rel="stylesheet" href="azy-foundation.css" />
  <link rel="stylesheet" href="azy-skin.css" />
  <link rel="stylesheet" href="azy-activity.css" />
  <link rel="stylesheet" href="azy-motion.css" />
  <link rel="stylesheet" href="azy-custom.css" />
</head>
<body class="snap-body">
  <div class="aurora" aria-hidden="true">
    <span class="blob blob--white"></span>
    <span class="blob blob--silver"></span>
    <span class="blob blob--slate"></span>
    <span class="grid-veil"></span>
  </div>
  <div class="app snap" id="snap">
    <!-- Header: same grabber-strip idea as the main window, so the whole bar moves it. -->
    <header class="snap-head">
      <div class="snap-brand-area">
        <button class="icon-btn" id="snapHomeBtn" title="Open Azy">
          <svg viewBox="0 0 24 24" width="15" height="15"><path d="M4 11 12 4l8 7v9h-5v-6H9v6H4z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
        </button>
        <span class="snap-logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="16" height="16"><path d="M7 3.5A3.5 3.5 0 1 1 3.5 7H7zm10 0A3.5 3.5 0 1 0 20.5 7H17zM7 20.5A3.5 3.5 0 1 1 3.5 17H7zm10 0a3.5 3.5 0 1 0 3.5-3.5H17zM7 7h10v10H7z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
        </span>
        <span class="snap-title-block"><span class="snap-kicker">KEYBOARD ACTIONS</span><span class="snap-title">Snap Action</span></span>
      </div>
      <span class="snap-conn" id="snapConn" title="">
        <span class="snap-dot"></span><span class="snap-conn-copy"><b>Premiere</b><em id="snapConnectionText">checking</em></span>
      </span>
      <span class="snap-spacer"></span>
      <div class="snap-tool-actions">
        <button class="icon-btn" id="snapSyncBtn" title="Refresh effects from Premiere">
          <svg viewBox="0 0 24 24" width="15" height="15"><path d="M20 12a8 8 0 0 1-14.3 4.9M4 12a8 8 0 0 1 14.3-4.9M18.5 3v4.5H14M5.5 21v-4.5H10" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button class="icon-btn" id="snapPairBtn" title="Azy in Premiere Pro — status">
          <svg viewBox="0 0 24 24" width="15" height="15"><path d="M9 15l6-6M8.5 12.5 6 15a3.5 3.5 0 0 0 5 5l2.5-2.5M15.5 11.5 18 9a3.5 3.5 0 0 0-5-5l-2.5 2.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        </button>
        <button class="icon-btn" id="snapPinBtn" title="Keep open (don't hide when focus leaves)" aria-pressed="false">
          <svg viewBox="0 0 24 24" width="15" height="15"><path d="M14.5 3.5 20.5 9.5 17 11l-2 5-2-2-5.5 5.5L6 18l5.5-5.5-2-2 5-2z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
        </button>
        <button class="icon-btn" id="snapCloseBtn" title="Hide (Esc)">
          <svg viewBox="0 0 24 24" width="15" height="15"><path d="M6 6l12 12M18 6 6 18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
        </button>
      </div>
    </header>

    <section class="snap-command-strip" aria-label="Snap Action workflow">
      <span class="snap-command-number">01</span>
      <span class="snap-command-copy"><b>Find the next action</b><em>Type a name, choose with arrows, then apply.</em></span>
      <span class="snap-command-key" title="Default shortcut; configure it in Azy settings"><kbd>Shift</kbd><kbd>Space</kbd></span>
    </section>

    <div class="snap-search">
      <svg class="snap-search-ic" viewBox="0 0 24 24" width="15" height="15"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="m16 16 4 4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
      <input id="snapInput" class="search-input snap-input" type="search" placeholder="Search presets, effects, transitions…" autocomplete="off" spellcheck="false" />
    </div>

    <div class="snap-meta">
      <span class="snap-count" id="snapCount">Loading…</span>
      <span class="snap-spacer"></span>
      <div class="snap-seg" id="snapMedia" role="tablist">
        <button class="snap-seg-btn active" data-media="" role="tab" aria-selected="true">All</button>
        <button class="snap-seg-btn" data-media="video" role="tab" aria-selected="false">
          <svg viewBox="0 0 24 24" width="12" height="12"><rect x="3" y="7" width="13" height="10" rx="2" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="m16 11 5-3v8l-5-3z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>Video
        </button>
        <button class="snap-seg-btn" data-media="audio" role="tab" aria-selected="false">
          <svg viewBox="0 0 24 24" width="12" height="12"><rect x="9" y="3" width="6" height="11" rx="3" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M6 11a6 6 0 0 0 12 0M12 17v4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>Audio
        </button>
        <button class="snap-seg-btn" data-fav="1" role="tab" aria-selected="false" title="Favorites only (Ctrl+F)">★</button>
      </div>
    </div>

    <div class="snap-list" id="snapList" role="listbox" tabindex="-1"></div>

    <footer class="snap-foot" id="snapFoot">
      <span class="snap-hint"><kbd>↑↓</kbd> move</span>
      <span class="snap-hint"><kbd>↵</kbd> apply</span>
      <span class="snap-hint"><kbd>Ctrl</kbd>+<kbd>D</kbd> star</span>
      <span class="snap-hint"><kbd>Tab</kbd> filter</span>
      <span class="snap-spacer"></span>
      <span class="snap-sel" id="snapSel"></span>
    </footer>
    <div class="toast-wrap" id="toastWrap"></div>
  </div>
  <div class="snap-dialog-back" id="snapPlaceDialog" hidden role="dialog" aria-modal="true" aria-labelledby="snapPlaceTitle">
    <div class="snap-dialog">
      <div class="snap-dialog-title" id="snapPlaceTitle">Where should the transition go?</div>
      <div class="snap-dialog-sub" id="snapPlaceName"></div>
      <div class="snap-dialog-opts">
        <button class="snap-dialog-opt" data-edges="start"><b>Start</b><span>At the start of each selected clip</span><kbd>1</kbd></button>
        <button class="snap-dialog-opt" data-edges="end"><b>End</b><span>At the end of each selected clip</span><kbd>2</kbd></button>
        <button class="snap-dialog-opt" data-edges="both"><b>Both</b><span>Both edges of each selected clip</span><kbd>3</kbd></button>
        <button class="snap-dialog-opt" data-edges="cuts"><b>Between clips</b><span>Only on cuts between two adjoining clips</span><kbd>4</kbd></button>
      </div>
      <div class="snap-dialog-foot"><span>↑↓ choose · Enter apply · Esc cancel</span><button class="snap-dialog-cancel" id="snapPlaceCancel">Cancel</button></div>
    </div>
  </div>
  <script src="azy-undo.js"></script>
    
  <script src="azy-theme-engine.js"></script>
  <script src="azy-web.js"></script>
  <script src="azy-motion.js"></script>
  <script src="azy-theme.js"></script>
  <script src="azy-ui.js"></script>
  <script src="azy-wait.js"></script>
  <script src="azy-done-sfx.js"></script>
  <script src="snap-renderer.js"></script>
  <script src="azy-resize.js"></script>
  <script src="azy-interactions.js"></script>
</body>
</html>
