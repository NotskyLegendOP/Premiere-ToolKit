name: Build installer

on:
  workflow_dispatch:
  push:
    branches: [main, "arena/**"]
    tags: ["v*"]

permissions:
  contents: write

defaults:
  run:
    working-directory: Main APP

jobs:
  windows:
    name: Windows installer (.exe / .msi)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Main APP/package-lock.json

      - name: Rust (stable, MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: Main APP/src-tauri

      - name: Install frontend deps
        run: npm ci

      - name: Build app + bundles
        run: npm run tauri -- build --bundles nsis,msi
        env:
          # keep the build reproducible / quiet
          CARGO_TERM_COLOR: always

      - name: Collect installers
        shell: pwsh
        run: |
          $root = "src-tauri/target/release/bundle"
          New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE/artifacts" | Out-Null
          if (Test-Path "$root/nsis") { Copy-Item "$root/nsis/*.exe" "$env:GITHUB_WORKSPACE/artifacts/" -Force }
          if (Test-Path "$root/msi")  { Copy-Item "$root/msi/*.msi"  "$env:GITHUB_WORKSPACE/artifacts/" -Force }
          Get-ChildItem "$env:GITHUB_WORKSPACE/artifacts" | Format-Table Name, Length

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: PremiereToolbox-${{ github.sha }}
          path: artifacts/*
          if-no-files-found: error

      # Pushing a v* tag publishes a GitHub Release with the installers attached.
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Premiere Toolbox 0.4.0 (Azy)
          draft: false
          generate_release_notes: true
          files: artifacts/*
